<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PrepPilot — AI-powered placement prep tracker with adaptive roadmaps, Jira sync, and weekly rebalancing." />
    <title>PrepPilot</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">

    <!-- Theme: read from localStorage before first paint to avoid FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pp-theme');
          if (saved === 'light') {
            document.documentElement.classList.add('light');
          } else if (!saved) {
            if (window.matchMedia('(prefers-color-scheme: light)').matches) {
              document.documentElement.classList.add('light');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
